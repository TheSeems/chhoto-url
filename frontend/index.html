<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chhoto URL</title>

    <meta
      name="description"
      content="A simple self-hosted URL shortener with no unnecessary features."
    />
    <meta property="og:title" content="Chhoto URL" />
    <meta
      property="og:description"
      content="A simple self-hosted URL shortener with no unnecessary features."
    />
    <meta
      property="og:image"
      content="https://chhoto.link/static/assets/banner.png"
    />
    <meta
      name="keywords"
      content="url shortener, link shortener, self hosted, open source"
    />

    <link
      rel="icon"
      type="image/x-icon"
      href="assets/favicon.ico"
      sizes="any"
    />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicon-32.png"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicon-196.png"
      sizes="196x196"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Code:wght@400;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/styles.css" />

    <!-- Optional: without it QR codes are skipped -->
    <script
      src="https://cdn.jsdelivr.net/gh/sintan1729/qrcodejs@0.1.0/qrcode.min.js"
      defer
    ></script>
    <script src="static/script.js" defer></script>
  </head>

  <body>
    <svg class="sprite" width="0" height="0" aria-hidden="true">
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="9" y="9" width="11" height="11" rx="1.5" />
        <path d="M15 5.5V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h.5" />
      </symbol>
      <symbol id="i-qr" viewBox="0 0 24 24">
        <rect x="4" y="4" width="6" height="6" />
        <rect x="14" y="4" width="6" height="6" />
        <rect x="4" y="14" width="6" height="6" />
        <path d="M14 14h2.5v2.5H14zM20 14v2M17.5 20H20v-1.5M14 20h1" />
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 11v5.5M12 7.5v.5" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24">
        <path d="M4 20h4L19.5 8.5l-4-4L4 16zM13.5 6.5l4 4" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M9.5 7V4h5v3M6 7l1 13h10l1-13M10 11v5.5M14 11v5.5" />
      </symbol>
      <symbol id="i-prev" viewBox="0 0 24 24">
        <path d="M14.5 5.5 8 12l6.5 6.5" />
      </symbol>
      <symbol id="i-next" viewBox="0 0 24 24">
        <path d="M9.5 5.5 16 12l-6.5 6.5" />
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24">
        <path d="M6 6l12 12M18 6 6 18" />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v11M7 10.5l5 5 5-5M5 20h14" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
        <circle cx="12" cy="12" r="3" />
        <path d="M4 4l16 16" />
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20.5c0-3.5 3.5-6 8-6s8 2.5 8 6" />
      </symbol>
      <!-- https://svgicons.com/icon/13641/bxl-github -->
      <symbol id="i-github" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          stroke="none"
          fill-rule="evenodd"
          d="M12.026 2c-5.509 0-9.974 4.465-9.974 9.974c0 4.406 2.857 8.145 6.821 9.465c.499.09.679-.217.679-.481c0-.237-.008-.865-.011-1.696c-2.775.602-3.361-1.338-3.361-1.338c-.452-1.152-1.107-1.459-1.107-1.459c-.905-.619.069-.605.069-.605c1.002.07 1.527 1.028 1.527 1.028c.89 1.524 2.336 1.084 2.902.829c.091-.645.351-1.085.635-1.334c-2.214-.251-4.542-1.107-4.542-4.93c0-1.087.389-1.979 1.024-2.675c-.101-.253-.446-1.268.099-2.64c0 0 .837-.269 2.742 1.021a9.582 9.582 0 0 1 2.496-.336a9.554 9.554 0 0 1 2.496.336c1.906-1.291 2.742-1.021 2.742-1.021c.545 1.372.203 2.387.099 2.64c.64.696 1.024 1.587 1.024 2.675c0 3.833-2.33 4.675-4.552 4.922c.355.308.675.916.675 1.846c0 1.334-.012 2.41-.012 2.737c0 .267.178.577.687.479C19.146 20.115 22 16.379 22 11.974C22 6.465 17.535 2 12.026 2z"
        />
      </symbol>
    </svg>

    <header class="masthead">
      <div id="logo">
        <img src="assets/favicon.svg" alt="" />
        <span> Chhoto URL</span>
      </div>
      <nav>
        <button class="chip" id="auth-button" hidden>
          <svg class="icon"><use href="#i-user" /></svg>
          <span>login</span>
        </button>
        <a
          class="chip"
          id="version"
          href="https://github.com/SinTan1729/chhoto-url"
          target="_blank"
          rel="noopener noreferrer"
          hidden
        >
          <svg class="icon"><use href="#i-github" /></svg>
          <span></span>
        </a>
      </nav>
    </header>

    <main>
      <form id="new-form">
        <div class="field">
          <label for="long-url">Long URL</label>
          <input
            type="url"
            name="longlink"
            id="long-url"
            placeholder="Please enter a valid URL"
            required
          />
        </div>
        <div class="field">
          <label for="short-url">Short URL (optional)</label>
          <input
            type="text"
            name="shortlink"
            id="short-url"
            placeholder="Only a-z, 0-9, - and _ are allowed"
            pattern="[a-z0-9\-_]+"
            title="Only a-z, 0-9, - and _ are allowed"
            autocapitalize="off"
          />
        </div>
        <details>
          <summary>More options</summary>
          <div id="options">
            <div class="field">
              <label for="expiry-delay">Expiry</label>
              <select name="expiry_delay" id="expiry-delay">
                <option value="0">Never</option>
                <option value="600">10 Minutes</option>
                <option value="1800">30 Minutes</option>
                <option value="3600">1 Hour</option>
                <option value="43200">12 Hours</option>
                <option value="86400">1 Day</option>
                <option value="604800">1 Week</option>
                <option value="2592000">1 Month</option>
                <option value="7776000">3 Months</option>
                <option value="15552000">6 Months</option>
                <option value="31536000">1 Year</option>
              </select>
            </div>
            <div class="field">
              <label for="notes">Notes</label>
              <textarea
                name="notes"
                id="notes"
                rows="2"
                placeholder="Notes for the link, used for filtering"
                title="Notes for the link"
              ></textarea>
            </div>
          </div>
        </details>
        <button class="button">Shorten!</button>
      </form>

      <p id="status">Loading links...</p>

      <section id="links" hidden>
        <div id="links-head">
          <h2>Active links</h2>
          <span id="pager" hidden>
            <button class="icon-button" id="prev-page" title="Previous page">
              <svg class="icon"><use href="#i-prev" /></svg>
            </button>
            <span id="page-number">1</span>
            <button class="icon-button" id="next-page" title="Next page">
              <svg class="icon"><use href="#i-next" /></svg>
            </button>
          </span>
          <form id="filter-form">
            <input
              type="text"
              name="filter"
              id="filter"
              placeholder="Filter shortlinks"
              pattern="(?:|[^\p{Cc}\p{Cs}\p{Co}\p{Cn}\u200B\uFEFF]{3,})"
              title="All valid Unicode characters are allowed, min length 3 chars"
              autocapitalize="off"
            />
            <button class="button outline">Filter</button>
          </form>
        </div>
        <table id="links-table">
          <thead>
            <tr>
              <th class="num">#</th>
              <th class="short">Short URL</th>
              <th>Long URL</th>
              <th class="hits">Hits</th>
              <th class="expiry">Expiry</th>
              <th class="actions">Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="no-matches" hidden>No links match this filter.</p>
      </section>
    </main>

    <template id="row-template">
      <tr>
        <td class="num" data-label="#"></td>
        <td class="short" data-label="Short URL">
          <a target="_blank" rel="noopener noreferrer"></a>
        </td>
        <td class="long" data-label="Long URL">
          <a target="_blank" rel="noopener noreferrer"></a>
        </td>
        <td class="hits" data-label="Hits"></td>
        <td class="expiry" data-label="Expiry"></td>
        <td class="actions">
          <button class="icon-button" data-action="copy" title="Copy short URL">
            <svg class="icon"><use href="#i-copy" /></svg>
          </button>
          <button class="icon-button" data-action="qr" title="Show QR code">
            <svg class="icon"><use href="#i-qr" /></svg>
          </button>
          <button class="icon-button" data-action="info" title="Show details">
            <svg class="icon"><use href="#i-info" /></svg>
          </button>
          <button class="icon-button" data-action="edit" title="Edit">
            <svg class="icon"><use href="#i-edit" /></svg>
          </button>
          <button class="icon-button" data-action="delete" title="Delete">
            <svg class="icon"><use href="#i-trash" /></svg>
          </button>
        </td>
      </tr>
    </template>

    <div id="toast" role="status" popover="manual"></div>

    <dialog id="login-dialog">
      <button class="icon-button dialog-close" id="login-close" title="Close">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
      <form id="login-form">
        <h2>Login to Chhoto URL</h2>
        <div id="password-fields">
          <div id="password-box">
            <input
              type="password"
              id="password"
              placeholder="Password"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="icon-button"
              id="password-eye"
              title="Toggle password visibility"
            >
              <svg class="icon"><use href="#i-eye" /></svg>
            </button>
          </div>
          <label class="check">
            <input type="checkbox" id="remember" />
            Remember me
          </label>
          <button class="button">Login</button>
        </div>
        <button class="button outline" id="oidc-button" type="button">
          Login with OIDC
        </button>
        <p class="error" id="login-error" hidden></p>
      </form>
    </dialog>

    <dialog id="edit-dialog">
      <form id="edit-form">
        <h2>Edit '<span id="edit-slug"></span>'</h2>
        <div class="field">
          <label for="edit-url">Long URL</label>
          <input type="url" id="edit-url" required />
        </div>
        <div class="field">
          <label for="edit-notes">Notes</label>
          <textarea id="edit-notes" rows="2"></textarea>
        </div>
        <div class="field">
          <label for="edit-expiry">Expiry</label>
          <input type="datetime-local" step="1" id="edit-expiry" />
        </div>
        <div class="checks">
          <label class="check">
            <input type="checkbox" id="edit-reset-hits" />
            Reset hit count
          </label>
          <label class="check">
            <input type="checkbox" id="edit-enabled" />
            Enabled
          </label>
        </div>
        <p class="error" id="edit-error" hidden></p>
        <div class="dialog-buttons">
          <button class="button outline" id="edit-cancel" type="button">
            Cancel
          </button>
          <button class="button">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="info-dialog" closedby="any">
      <button class="icon-button dialog-close" title="Close">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
      <dl>
        <dt>Short URL</dt>
        <dd id="info-short"></dd>
        <dt>Long URL</dt>
        <dd><a id="info-long" target="_blank" rel="noopener noreferrer"></a></dd>
        <dt>Hits</dt>
        <dd id="info-hits"></dd>
        <dt>Expiry</dt>
        <dd id="info-expiry"></dd>
        <dt>Enabled</dt>
        <dd id="info-enabled"></dd>
        <dt>Notes</dt>
        <dd id="info-notes"></dd>
      </dl>
    </dialog>

    <dialog id="qr-dialog" closedby="any">
      <a class="icon-button dialog-close" id="qr-download" title="Download">
        <svg class="icon"><use href="#i-download" /></svg>
      </a>
      <button class="icon-button dialog-close" title="Close">
        <svg class="icon"><use href="#i-close" /></svg>
      </button>
      <div id="qr-code"></div>
    </dialog>
  </body>
</html>
